<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FogEdit</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
<h1>FogEdit</h1>
<div id="node-info" class="node-info">Loading node info...</div>
</header>
<main>
<section id="projects-section">
<h2>Projects</h2>
<form id="create-project-form">
<input type="text" id="project-name" placeholder="Project name" required>
<button type="submit">Create Project</button>
</form>
<ul id="project-list"></ul>
</section>
<section id="project-view" class="hidden">
<h2 id="current-project-name"></h2>
<section id="upload-section">
<h3>Upload Video</h3>
<form id="upload-form" enctype="multipart/form-data">
<input type="file" id="video-file" accept="video/*" required>
<button type="submit">Upload</button>
</form>
<video id="video-preview" controls class="hidden"></video>
<div id="file-meta" class="hidden"></div>
</section>
<section id="operations-section" class="hidden">
<h3>Operations Pipeline</h3>
<div id="operations-list"></div>
<div class="add-operation">
<select id="op-select">
<option value="trim">Trim</option>
<option value="resize">Resize</option>
<option value="compress">Compress</option>
<option value="convert">Convert</option>
<option value="denoise">Denoise</option>
<option value="color_grade">Color grade</option>
</select>
<button id="add-op-btn" type="button">Add Operation</button>
</div>
<button id="submit-job-btn" type="button">Submit Job</button>
</section>
<section id="jobs-section" class="hidden">
<h3>Jobs</h3>
<ul id="job-list"></ul>
</section>
</section>
</main>
<template id="op-trim-template">
<div class="op-item" data-op="trim">
<span>Trim</span>
<input type="number" data-field="start" placeholder="Start (s)" step="0.1" min="0" required>
<input type="number" data-field="end" placeholder="End (s)" step="0.1" min="0" required>
<button type="button" class="remove-op">Remove</button>
</div>
</template>
<template id="op-resize-template">
<div class="op-item" data-op="resize">
<span>Resize</span>
<input type="number" data-field="width" placeholder="Width" min="1" required>
<input type="number" data-field="height" placeholder="Height" min="1" required>
<button type="button" class="remove-op">Remove</button>
</div>
</template>
<template id="op-compress-template">
<div class="op-item" data-op="compress">
<span>Compress</span>
<input type="number" data-field="crf" placeholder="CRF (0-51)" min="0" max="51" value="23" required>
<select data-field="preset">
<option value="ultrafast">ultrafast</option>
<option value="superfast">superfast</option>
<option value="veryfast">veryfast</option>
<option value="faster">faster</option>
<option value="fast">fast</option>
<option value="medium" selected>medium</option>
<option value="slow">slow</option>
<option value="slower">slower</option>
<option value="veryslow">veryslow</option>
</select>
<button type="button" class="remove-op">Remove</button>
</div>
</template>
<template id="op-convert-template">
<div class="op-item" data-op="convert">
<span>Convert</span>
<select data-field="format">
<option value="mp4">mp4</option>
<option value="webm">webm</option>
<option value="mkv">mkv</option>
<option value="avi">avi</option>
</select>
<button type="button" class="remove-op">Remove</button>
</div>
</template>

<template id="op-denoise-template">
<div class="op-item op-wide" data-op="denoise">
<span>Denoise</span>
<div class="op-fields">
<label>Method
<select data-field="method">
<option value="nlmeans">nlmeans (best quality, slow)</option>
<option value="hqdn3d">hqdn3d (fast)</option>
</select>
</label>
<label>Intensity
<select data-field="intensity">
<option value="light">light</option>
<option value="medium">medium</option>
<option value="strong">strong</option>
</select>
</label>
<label>Strength (nlmeans only, 1 to 30)
<input type="number" data-field="strength" min="1" max="30" step="0.5" placeholder="auto">
</label>
<small class="op-hint">Leave strength empty to use the intensity preset. hqdn3d ignores strength.</small>
</div>
<button type="button" class="remove-op">Remove</button>
</div>
</template>
<template id="op-color_grade-template">
<div class="op-item op-wide" data-op="color_grade">
<span>Color grade</span>
<div class="op-fields">
<label>Style preset
<select data-field="preset">
<option value="">none</option>
<option value="warm">warm</option>
<option value="cool">cool</option>
<option value="cinematic">cinematic</option>
<option value="vivid">vivid</option>
</select>
</label>
<label>Brightness (-1 to 1)
<input type="number" data-field="brightness" min="-1" max="1" step="0.05" placeholder="0">
</label>
<label>Contrast (0 to 3)
<input type="number" data-field="contrast" min="0" max="3" step="0.05" placeholder="1">
</label>
<label>Saturation (0 to 3)
<input type="number" data-field="saturation" min="0" max="3" step="0.05" placeholder="1">
</label>
<label>Gamma (0.1 to 10)
<input type="number" data-field="gamma" min="0.1" max="10" step="0.05" placeholder="1">
</label>
<label>Curves preset
<select data-field="curves_preset">
<option value="">none</option>
<option value="lighter">lighter</option>
<option value="darker">darker</option>
<option value="increase_contrast">increase_contrast</option>
<option value="medium_contrast">medium_contrast</option>
<option value="strong_contrast">strong_contrast</option>
<option value="linear_contrast">linear_contrast</option>
<option value="cross_process">cross_process</option>
<option value="vintage">vintage</option>
<option value="negative">negative</option>
<option value="color_negative">color_negative</option>
</select>
</label>
<div class="cb-row"><b>Shadows</b>
<input type="number" data-field="cb_shadows_r" min="-1" max="1" step="0.05" placeholder="R">
<input type="number" data-field="cb_shadows_g" min="-1" max="1" step="0.05" placeholder="G">
<input type="number" data-field="cb_shadows_b" min="-1" max="1" step="0.05" placeholder="B">
</div>
<div class="cb-row"><b>Midtones</b>
<input type="number" data-field="cb_midtones_r" min="-1" max="1" step="0.05" placeholder="R">
<input type="number" data-field="cb_midtones_g" min="-1" max="1" step="0.05" placeholder="G">
<input type="number" data-field="cb_midtones_b" min="-1" max="1" step="0.05" placeholder="B">
</div>
<div class="cb-row"><b>Highlights</b>
<input type="number" data-field="cb_highlights_r" min="-1" max="1" step="0.05" placeholder="R">
<input type="number" data-field="cb_highlights_g" min="-1" max="1" step="0.05" placeholder="G">
<input type="number" data-field="cb_highlights_b" min="-1" max="1" step="0.05" placeholder="B">
</div>
<small class="op-hint">Empty fields are left unchanged. Values you type override the style preset, and any color balance you enter replaces the preset's own tint.</small>
</div>
<button type="button" class="remove-op">Remove</button>
</div>
</template>


<template id="job-item-template">
<li class="job-item">
<div class="job-header">
<span class="job-id"></span>
<span class="job-status"></span>
</div>
<div class="progress-bar"><div class="progress-fill"></div></div>
<div class="job-step"></div>
<div class="job-error"></div>
<a class="job-download hidden" href="#">Download result</a>
</li>
</template>
<script src="/static/app.js"></script>
</body>
</html>
